version: '3.9'

# Production compose — uses multi-stage Docker builds.
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires a .env.prod file (copy .env.example and fill in real values).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nalogai_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: nalogai_redis_prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nalogai_backend_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - public
    # Run migrations before starting server
    command: >
      sh -c "npx prisma migrate deploy --schema=./prisma/schema.prisma && node dist/index.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.75'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
    container_name: nalogai_frontend_prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal   # needs this to reach http://backend:4000
      - public     # exposes port 80 externally
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64m
          cpus: '0.25'

  # ── Daily DB Backup ────────────────────────────────────────────────────────
  db-backup:
    image: pgvector/pgvector:pg16
    container_name: nalogai_db_backup_prod
    restart: unless-stopped
    entrypoint: >
      sh -c "
        echo '0 2 * * * pg_dump $${DATABASE_URL} --no-owner --no-acl | gzip > /backups/nalogai_$$(date +\%Y\%m\%d).sql.gz && find /backups -name \"nalogai_*.sql.gz\" -mtime +$${BACKUP_RETAIN_DAYS:-30} -delete' | crontab -
        crond -f -l 2
      "
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  postgres_backups:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true   # not reachable from outside
  public:
    driver: bridge
